# =============================================================================
# CI — Integração Contínua
#
# Roda em todo pull request e em todo push na main. Nenhum código entra na
# main sem passar por aqui (configure a proteção de branch exigindo estes jobs).
#
#   backend ──┐
#   frontend ─┼──► e2e (stack completa em Docker)
#   security ─┘
#
# Boas práticas aplicadas:
#   - permissions mínimas (só leitura do código);
#   - concurrency: um push novo cancela a execução anterior do mesmo branch;
#   - caches de módulos Go e npm para builds rápidos;
#   - as actions de terceiros devem ser fixadas por SHA em produção (o
#     Dependabot mantém atualizadas — veja .github/dependabot.yml).
# =============================================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Linha do Go usada no CI: a MESMA das imagens de produção (ARG GO_VERSION em
  # deploy/docker/go-service.Dockerfile). O go.mod declara só a versão mínima da
  # linguagem (go 1.26.0); se o CI usasse esse número, testaria com um patch
  # antigo da biblioteca padrão, diferente do que vai para produção.
  # check-latest pega sempre o patch mais recente (com as correções de segurança).
  GO_VERSION: "1.27"

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    # PostgreSQL de verdade para os testes de integração (tag "integration").
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Formatação (gofmt)
        run: |
          unformatted=$(gofmt -l pkg services tools tests)
          if [ -n "$unformatted" ]; then
            echo "Arquivos sem gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Análise estática (go vet)
        run: go vet -tags=integration,e2e ./...

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Testes unitários e de integração (com detector de corrida)
        env:
          INTEGRATION_DATABASE_URL: postgres://postgres:postgres_ci@localhost:5432/postgres?sslmode=disable
        run: go test -race -tags=integration -count=1 -coverprofile=coverage.out ./...

      - name: Resumo de cobertura
        run: go tool cover -func=coverage.out | tail -1

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Tipos (TypeScript)
        run: npm run typecheck
      - name: Testes unitários (Vitest)
        run: npm test
      - name: Build de produção
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  security:
    name: Segurança
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # o gitleaks examina o histórico completo

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Vulnerabilidades conhecidas nas dependências Go (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Vulnerabilidades nas dependências npm
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      - name: Segredos vazados no código (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: Testes de ponta a ponta
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Subir a stack completa
        env:
          RATE_LIMIT_AUTH_PER_MINUTE: "500"
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 300

      - name: Carregar dados de demonstração
        run: docker compose run --rm seed

      - name: E2E da API (Go)
        run: go test -tags=e2e -count=1 -timeout 10m ./tests/e2e/...

      - name: E2E da interface (Playwright)
        working-directory: web
        env:
          CI: "true"
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Logs dos serviços (em caso de falha)
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-diagnostico
          path: |
            web/playwright-report
            web/test-results
            compose-logs.txt
          retention-days: 7
