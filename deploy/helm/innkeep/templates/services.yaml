{{- /*
Um Deployment + Service (+ HPA + PodDisruptionBudget) por microserviço Go.
O laço percorre .Values.services: acrescentar um serviço novo é acrescentar um
bloco no values.yaml.
*/ -}}
{{- range $name, $svc := .Values.services }}
{{- $ctx := dict "root" $ "name" $name }}
{{- $replicas := $svc.replicas | default $.Values.defaults.replicas }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "innkeep.fullname" $ctx }}
  labels: {{- include "innkeep.labels" $ctx | nindent 4 }}
spec:
  {{- if not $.Values.defaults.autoscaling.enabled }}
  replicas: {{ $replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: {{- include "innkeep.selector" $ctx | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Sobe um pod novo antes de derrubar um antigo: deploy sem indisponibilidade.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels: {{- include "innkeep.labels" $ctx | nindent 8 }}
    spec:
      serviceAccountName: {{ $.Release.Name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # usuário "nonroot" da imagem distroless
        fsGroup: 65532
      # Espalha as réplicas entre zonas de disponibilidade: a queda de uma
      # zona da AWS não derruba o serviço.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "innkeep.selector" $ctx | nindent 14 }}
      # Tempo para o desligamento gracioso: terminar requisições e commitar offsets.
      terminationGracePeriodSeconds: 40
      containers:
        - name: {{ $name }}
          image: {{ include "innkeep.image" $ctx }}
          imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $.Values.defaults.port }}
          env:
            {{- include "innkeep.commonEnv" $ctx | nindent 12 }}
            {{- if $svc.kafka }}
            {{- include "innkeep.kafkaEnv" $ctx | nindent 12 }}
            {{- end }}
            {{- range $key, $value := $svc.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- include "innkeep.secretEnv" (dict "root" $ "keys" ($svc.secretEnv | default list)) | nindent 12 }}
          # liveness: o processo está vivo? (se falhar, o pod é reiniciado)
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          # readiness: pode receber tráfego? (verifica banco, Kafka, Redis)
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          resources: {{- toYaml ($svc.resources | default $.Values.defaults.resources) | nindent 12 }}
          securityContext: {{- include "innkeep.containerSecurity" $ctx | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "innkeep.fullname" $ctx }}
  labels: {{- include "innkeep.labels" $ctx | nindent 4 }}
spec:
  selector: {{- include "innkeep.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if $.Values.defaults.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "innkeep.fullname" $ctx }}
  labels: {{- include "innkeep.labels" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "innkeep.fullname" $ctx }}
  minReplicas: {{ $.Values.defaults.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.defaults.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.defaults.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "innkeep.fullname" $ctx }}
  labels: {{- include "innkeep.labels" $ctx | nindent 4 }}
spec:
  # Durante manutenções do cluster, ao menos um pod de cada serviço fica de pé.
  minAvailable: 1
  selector:
    matchLabels: {{- include "innkeep.selector" $ctx | nindent 6 }}
{{- end }}
